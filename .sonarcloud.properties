# Automatic Analysis only (ignored by CI-based analysis).
# sonar.sources: directories only, no wildcards.

sonar.sources=packages
sonar.sourceEncoding=UTF-8

# Vite playground only (yarn start publicDir / package index.html).
# One * = one path segment, so this does not drop src/**/public/ (player UI).
sonar.exclusions=\
  packages/*/public/**,\
  packages/*/index.html,\
  packages/*/index.*.html
