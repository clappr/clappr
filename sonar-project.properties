# Read by sonar.yml. Automatic Analysis ignores this file — disable it on
# clappr_clappr after this lands on main (project Administration → Analysis Method).
# Project key matches the existing SonarCloud project / README badge.

sonar.organization=clappr
sonar.projectKey=clappr_clappr

sonar.sources=packages
sonar.sourceEncoding=UTF-8

# Vite playground only (yarn start publicDir / package index.html).
# Does not drop src/**/public/ (player UI).
sonar.exclusions=\
  packages/*/public/**,\
  packages/*/index.html,\
  packages/*/index.*.html
