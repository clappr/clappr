# Manual only, and never called by Release: the notes are an announcement a person
# decides to draft once the Player is on npm.
name: Release notes

on:
  workflow_dispatch:
    inputs:
      player_tag:
        description: 'Player tag to draft notes for (empty = latest @clappr/player tag)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Draft release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PLAYER_TAG: ${{ inputs.player_tag }}
        run: node .github/scripts/release/cli.mjs notes --tag "$PLAYER_TAG"
