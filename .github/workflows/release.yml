# Hand-triggered only: releasing is a decision, not a consequence of merging.
#
# One package per run, with the bump chosen by the person dispatching. `preview` (on by
# default) plans the release and stops; every step that changes something is guarded on it.
# `Validate dispatch` re-states what a button does not give for free: the commit is on main
# and has passed CI. Removing it re-opens publishing a red commit.
name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        type: choice
        default: '@clappr/player'
        options:
          - '@clappr/player'
          - '@clappr/core'
          - '@clappr/plugins'
          - '@clappr/hlsjs-playback'
          - '@clappr/telemetry'
          - 'dash-shaka-playback'
          - '@clappr/clappr-html5-tvs-playback'
          - '@clappr/level-selector'
      bump:
        description: 'Version bump'
        type: choice
        default: 'patch'
        options:
          - 'patch'
          - 'minor'
          - 'major'
      preview:
        description: 'Preview only: show the plan and stop (nothing is committed, tagged or published)'
        type: boolean
        default: true

# Never cancel in progress: a cancel landing between the push and the publish leaves a tag
# on main with nothing on npm.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      # Lets `Validate dispatch` read the CI run for this SHA.
      actions: read

    steps:
      # First, and before the app token: a rejected dispatch costs nothing and mints no
      # credential.
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: node .github/scripts/release/cli.mjs validate

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Full history: the plan reads every commit since the package's last tag.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # App must be in main's bypass_pull_request_allowances (built-in
          # GitHub Actions cannot). See #2455 / #2460.
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      # Keep the npm registry config off this step: setup-node writes ${NODE_AUTH_TOKEN} into
      # .npmrc, and Yarn Classic fails on `yarn cache dir` when that env is unset.
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Ensure npm supports trusted publishing
        if: ${{ !inputs.preview }}
        run: npm install -g npm@^11.5.0

      - name: Install dependencies
        if: ${{ !inputs.preview }}
        run: yarn --frozen-lockfile

      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PACKAGE: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          node .github/scripts/release/cli.mjs plan \
            --package "$PACKAGE" --bump "$BUMP" --preview "$PREVIEW" \
            --out "$RUNNER_TEMP/plan.json"

      - name: Apply release
        if: ${{ !inputs.preview && steps.plan.outputs.mode == 'release' }}
        run: node .github/scripts/release/cli.mjs apply --plan "$RUNNER_TEMP/plan.json"

      - name: Push commit, then tag
        if: ${{ !inputs.preview && steps.plan.outputs.mode == 'release' }}
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git push origin HEAD:main
          git push origin "$TAG"

      # registry-url only here so Yarn never sees the auth .npmrc during install/cache.
      - name: Configure npm registry
        if: ${{ !inputs.preview }}
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org

      # A failure fails the run: the tag is already on main, and recovering is dispatching
      # the same package again.
      - name: Publish
        if: ${{ !inputs.preview }}
        env:
          PACKAGE: ${{ steps.plan.outputs.name }}
        run: npm publish -w "$PACKAGE" --provenance
