name: Release

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Skip versioning; publish current package.json versions (recovery after a failed publish)'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      id-token: write
    outputs:
      player_published: ${{ steps.announce.outputs.player_published || 'false' }}
      player_tag: ${{ steps.announce.outputs.player_tag || '' }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # App must be in main's bypass_pull_request_allowances (built-in
          # GitHub Actions cannot). See #2455 / #2460.
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: https://registry.npmjs.org
          cache: 'yarn'

      - name: Ensure npm supports trusted publishing
        run: |
          # Pin to npm 11: trusted publishing needs a recent npm, but npm 12 stopped
          # forcing JSON from `npm pkg get` and can surprise CI with other CLI changes.
          npm install -g npm@^11.5.0
          npm --version

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Resolve packages to publish
        id: changed
        env:
          PUBLISH_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_only }}
        run: |
          git fetch --tags
          set +e
          ERR_FILE=$(mktemp)
          if [ "$PUBLISH_ONLY" = "true" ]; then
            # Recovery: versions/tags already on main; publish public packages as-is.
            OUTPUT=$(npx lerna list --json 2>"$ERR_FILE")
            EXIT_CODE=$?
          else
            # Keep lerna notices on stderr out of OUTPUT — mixing 2>&1 breaks jq.
            OUTPUT=$(npx lerna changed --include-merged-tags --json 2>"$ERR_FILE")
            EXIT_CODE=$?
          fi
          set -e
          ERR=$(cat "$ERR_FILE")
          rm -f "$ERR_FILE"
          if [ -n "$ERR" ]; then
            echo "$ERR"
          fi

          if [ "$PUBLISH_ONLY" != "true" ] && echo "$ERR$OUTPUT" | grep -q "No changed packages found"; then
            echo "packages=[]" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "publish_only=false" >> "$GITHUB_OUTPUT"
            echo "No packages to publish"
            exit 0
          fi

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Error resolving packages (exit code: $EXIT_CODE):"
            echo "$ERR"
            echo "$OUTPUT"
            exit 1
          fi

          PKGS=$(echo "$OUTPUT" | jq -c '[.[] | select(.private == false) | .name]')
          echo "packages=$PKGS" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$PKGS" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "publish_only=$PUBLISH_ONLY" >> "$GITHUB_OUTPUT"
          echo "Packages to publish: $PKGS"

      - name: Version and tag
        if: steps.changed.outputs.count != '0' && steps.changed.outputs.publish_only != 'true'
        run: npx lerna version --include-merged-tags --no-push --yes

      - name: Push commit, then tags
        if: steps.changed.outputs.count != '0' && steps.changed.outputs.publish_only != 'true'
        run: |
          # Fail here if branch protection rejects the bot — before any tags leave the runner
          git push origin HEAD:main
          git push origin --tags

      - name: Publish to npm
        if: steps.changed.outputs.count != '0'
        run: |
          failed=()
          # Versions after lerna version live in package.json; read them via Lerna JSON
          # instead of `npm pkg get` stdout (npm 12+ is not JSON by default — see #2472).
          ERR_FILE=$(mktemp)
          LIST_JSON=$(npx lerna list --json 2>"$ERR_FILE")
          LIST_EXIT=$?
          ERR=$(cat "$ERR_FILE")
          rm -f "$ERR_FILE"
          if [ -n "$ERR" ]; then
            echo "$ERR"
          fi
          if [ $LIST_EXIT -ne 0 ]; then
            echo "::error::Could not list package versions (exit code: $LIST_EXIT)"
            exit 1
          fi

          for pkg in $(echo '${{ steps.changed.outputs.packages }}' | jq -r '.[]'); do
            echo "::group::publish $pkg"
            ver=$(echo "$LIST_JSON" | jq -r --arg pkg "$pkg" '.[] | select(.name == $pkg) | .version')
            if [ -z "$ver" ] || [ "$ver" = "null" ]; then
              echo "::error::Could not resolve version for $pkg"
              failed+=("$pkg")
              echo "::endgroup::"
              continue
            fi
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "Skipping $pkg@$ver (already on npm)"
              echo "::endgroup::"
              continue
            fi
            if ! npm publish -w "$pkg" --provenance; then
              echo "::error::Failed to publish $pkg@$ver"
              failed+=("$pkg@$ver")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Publish failures: ${failed[*]}"
            exit 1
          fi

      # Only announce when this run's publish set included @clappr/player and
      # Publish to npm succeeded (skip-already-on-npm counts as success).
      - name: Set release notes outputs
        id: announce
        if: steps.changed.outputs.count != '0'
        env:
          PACKAGES_JSON: ${{ steps.changed.outputs.packages }}
        run: |
          if ! echo "$PACKAGES_JSON" | jq -e 'index("@clappr/player") != null' >/dev/null; then
            echo "player_published=false" >> "$GITHUB_OUTPUT"
            echo "player_tag=" >> "$GITHUB_OUTPUT"
            echo "Player not in publish set; skipping release notes"
            exit 0
          fi
          ver=$(jq -r '.version' packages/player/package.json)
          if [ -z "$ver" ] || [ "$ver" = "null" ]; then
            echo "::error::Could not read @clappr/player version from package.json"
            exit 1
          fi
          echo "player_published=true" >> "$GITHUB_OUTPUT"
          echo "player_tag=@clappr/player@${ver}" >> "$GITHUB_OUTPUT"
          echo "Will request release notes for @clappr/player@${ver}"

  # Draft GitHub Release only after a successful player publish (not on empty
  # Release runs or non-player-only publishes).
  notes:
    needs: release
    if: needs.release.outputs.player_published == 'true'
    permissions:
      contents: write
      pull-requests: read
    secrets: inherit
    uses: ./.github/workflows/generate-release-notes.yml
    with:
      player_tag: ${{ needs.release.outputs.player_tag }}

  notify-failure:
    needs: release
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open issue for failed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo ${{ github.repository }} \
            --title "Release workflow failed on $(date -u +%Y-%m-%d)" \
            --label bug \
            --body "The Release workflow failed and no packages were published.

          Run: $RUN_URL

          Check the failing step before re-running. Recovery is manual via \`workflow_dispatch\` (use publish_only if versions/tags already landed)."
