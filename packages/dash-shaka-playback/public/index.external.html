<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <title>clappr dash shaka (external)</title>
</head>
<body>
    <div id="player"></div>
    <p><a href="index.html">Load bundled shaka version</a></p>
    <script type="text/javascript" charset="utf-8">
        window.onload = function () {
            var LicenseRequest = shaka.net.NetworkingEngine.RequestType.LICENSE
            var onBeforeLoad = function (shaka_player) {
                shaka_player.getNetworkingEngine().registerRequestFilter(function (type, request) {
                    if (type === LicenseRequest) {
                        // do something
                    }
                });
                shaka_player.getNetworkingEngine().registerResponseFilter(function (type, response) {
                    if (type === LicenseRequest) {
                        // do something
                    }
                });
            }

            new Clappr.Player({
                parentId: '#player', autoPlay: true,
                plugins: [DashShakaPlayback],
                shakaConfiguration: {
                    preferredAudioLanguage: 'pt-BR',
                    streaming: {
                        rebufferingGoal: 15
                    }
                },
                shakaOnBeforeLoad: onBeforeLoad,
                source: '//storage.googleapis.com/shaka-demo-assets/angel-one/dash.mpd',
                height: 360,
                width: 640
            })
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    <!-- Peer accepts shaka-player ^3 || ^4; swap @4 for @3 to exercise Shaka 3 -->
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.js"></script>
    <script type="text/javascript" charset="utf-8" src="dash-shaka-playback.external.js"> </script>
</body>
</html>
